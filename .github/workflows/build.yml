name: Build U-Boot for W1700K / XR1710G

on:
  push:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      board:
        description: Target board
        required: true
        default: w1700k
        type: choice
        options:
          - w1700k
          - xr1710g
      release_type:
        description: Build only, create a pre-release, or create a release
        required: true
        default: test
        type: choice
        options:
          - test
          - pre-release
          - release

env:
  CROSS_COMPILE: aarch64-linux-gnu-
  ARCH: arm
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  build:
    name: Build U-Boot
    runs-on: ubuntu-latest
    outputs:
      board: ${{ steps.board.outputs.value }}
      defconfig: ${{ steps.board.outputs.defconfig }}
      artifact_name: ${{ steps.slotname.outputs.artifact_name }}
      build_mode: ${{ steps.mode.outputs.value }}
      commit: ${{ steps.version.outputs.commit }}
      fit_name: ${{ steps.slotname.outputs.fit_name }}
      release_date: ${{ steps.version.outputs.release_date }}
      slot_name: ${{ steps.slotname.outputs.slot_name }}
      tag: ${{ steps.slotname.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve board
        id: board
        run: |
          BOARD="${{ github.event.inputs.board }}"
          BOARD="${BOARD:-w1700k}"
          case "$BOARD" in
            xr1710g) DEFCONFIG="xr1710g_defconfig" ;;
            w1700k) DEFCONFIG="an7581_w1700k_defconfig" ;;
            *) echo "Unsupported board: $BOARD" >&2; exit 1 ;;
          esac
          echo "value=$BOARD" >> "$GITHUB_OUTPUT"
          echo "defconfig=$DEFCONFIG" >> "$GITHUB_OUTPUT"
          echo "Board: $BOARD (defconfig: $DEFCONFIG)"

      - name: Select build mode
        id: mode
        env:
          REQUESTED_MODE: ${{ github.event.inputs.release_type }}
        run: |
          MODE="${REQUESTED_MODE:-test}"
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            MODE="test"
          fi
          case "$MODE" in
            test|pre-release|release) ;;
            *)
              echo "Unsupported build mode: $MODE" >&2
              exit 1
              ;;
          esac
          echo "value=$MODE" >> "$GITHUB_OUTPUT"
          echo "Build mode: $MODE"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            build-essential \
            bison \
            flex \
            swig \
            python3-dev \
            python3-setuptools \
            python3-pyelftools \
            libssl-dev \
            device-tree-compiler \
            bc

      - name: Configure
        run: |
          make ${{ steps.board.outputs.defconfig }}

      - name: Build U-Boot
        run: |
          make -j$(nproc) all

      - name: Get version info
        id: version
        run: |
          COMMIT_SHORT=$(git rev-parse --short=12 HEAD)
          DATE=$(date +%Y%m%d)
          VERSION=$(sed -n 's/.*PLAIN_VERSION "\(.*\)".*/\1/p' include/generated/version_autogenerated.h 2>/dev/null | head -1)
          if [ -z "$VERSION" ]; then
            VERSION=$(date +%Y.%m)
          fi
          echo "commit=${COMMIT_SHORT}" >> $GITHUB_OUTPUT
          echo "date=${DATE}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          RELEASE_DATE=$(date +%Y-%-m-%-d)
          echo "release_date=${RELEASE_DATE}" >> $GITHUB_OUTPUT
          echo "Parsed version: ${VERSION}"

      - name: List build output
        run: |
          ls -la u-boot.bin u-boot.img u-boot.dtb || true
          ls -la tools/mkimage tools/dumpimage || true

      - name: Package chainloader slot image
        run: |
          chmod +x chainloader/build-chainloader-fit.sh
          ./chainloader/build-chainloader-fit.sh \
            u-boot.bin \
            out \
            tools/mkimage \
            tools/dumpimage \
            ${{ steps.board.outputs.value }}
          ls -la out/

      - name: Generate flash-slot.bin with version name
        id: slotname
        run: |
          BOARD="${{ steps.board.outputs.value }}"
          ARTIFACT_NAME="${BOARD}-uboot-${{ steps.version.outputs.date }}-${{ steps.version.outputs.commit }}"
          SLOT_NAME="${BOARD}-uboot-${{ steps.version.outputs.release_date }}-${{ steps.version.outputs.commit }}-flash-slot.bin"
          FIT_NAME="${BOARD}-uboot-${{ steps.version.outputs.release_date }}-${{ steps.version.outputs.commit }}-chainloader.itb"
          cp "out/${BOARD}-chainloader-slot.bin" "out/${SLOT_NAME}"
          cp "out/${BOARD}-chainloader.itb" "out/${FIT_NAME}"
          echo "artifact_name=${ARTIFACT_NAME}" >> $GITHUB_OUTPUT
          echo "slot_name=${SLOT_NAME}" >> $GITHUB_OUTPUT
          echo "fit_name=${FIT_NAME}" >> $GITHUB_OUTPUT
          echo "tag=${{ steps.version.outputs.release_date }}-${{ steps.version.outputs.commit }}" >> $GITHUB_OUTPUT
          sha256sum "out/${SLOT_NAME}"
          sha256sum "out/${FIT_NAME}" 

      - name: Prepare artifacts
        run: |
          mkdir -p build-output
          cp u-boot.bin build-output/
          cp u-boot.img build-output/
          cp u-boot.dtb build-output/ 2>/dev/null || true
          cp tools/mkimage build-output/ 2>/dev/null || true
          cp "out/${{ steps.board.outputs.value }}-chainloader-slot.bin" build-output/
          cp "out/${{ steps.board.outputs.value }}-chainloader.itb" build-output/
          cp "out/${{ steps.slotname.outputs.slot_name }}" build-output/
          cp "out/${{ steps.slotname.outputs.fit_name }}" build-output/
          echo "Build date: $(date)" > build-output/build-info.txt
          echo "Commit: $(git rev-parse HEAD)" >> build-output/build-info.txt
          echo "Commit short: $(git rev-parse --short HEAD)" >> build-output/build-info.txt
          echo "Ref: ${GITHUB_REF_NAME}" >> build-output/build-info.txt
          echo "Build mode: ${{ steps.mode.outputs.value }}" >> build-output/build-info.txt
          echo "U-Boot version: ${{ steps.version.outputs.version }}" >> build-output/build-info.txt
          echo "" >> build-output/build-info.txt
          echo "Flash slot image: ${{ steps.slotname.outputs.slot_name }}" >> build-output/build-info.txt
          echo "Chainloader FIT: ${{ steps.slotname.outputs.fit_name }}" >> build-output/build-info.txt
          echo "" >> build-output/build-info.txt
          echo "SHA256 sums:" >> build-output/build-info.txt
          sha256sum "out/${{ steps.slotname.outputs.slot_name }}" >> build-output/build-info.txt
          sha256sum "out/${{ steps.slotname.outputs.fit_name }}" >> build-output/build-info.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.slotname.outputs.artifact_name }}
          path: build-output/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && needs.build.outputs.build_mode != 'test' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release-output

      - name: Create or update GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_MODE: ${{ needs.build.outputs.build_mode }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_TITLE: ${{ needs.build.outputs.board }} U-Boot-${{ needs.build.outputs.release_date }}-g${{ needs.build.outputs.commit }}
          SLOT_NAME: ${{ needs.build.outputs.slot_name }}
          FIT_NAME: ${{ needs.build.outputs.fit_name }}
        run: |
          SLOT_PATH="release-output/${SLOT_NAME}"
          FIT_PATH="release-output/${FIT_NAME}"
          for FILE in "$SLOT_PATH" "$FIT_PATH"; do
            if [ ! -f "$FILE" ]; then
              echo "Release asset not found: $FILE" >&2
              exit 1
            fi
          done

          SLOT_SHA=$(sha256sum "$SLOT_PATH" | awk '{print $1}')
          FIT_SHA=$(sha256sum "$FIT_PATH" | awk '{print $1}')
          NOTES_FILE=$(mktemp)
          cat > "$NOTES_FILE" <<EOF
          Automated build from commit [\`${{ needs.build.outputs.commit }}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}).

          **Release channel:** ${RELEASE_MODE}

          ## Files

          - **\`${SLOT_NAME}\`** — Flash through the HTTP Recovery \`uboot\` target.
          - **\`${FIT_NAME}\`** — RAM-only validation through TFTP. Do not upload this file to HTTP Recovery.

          ## SHA256

          \`\`\`text
          ${SLOT_SHA}  ${SLOT_NAME}
          ${FIT_SHA}  ${FIT_NAME}
          \`\`\`

          ## Flash via HTTP Recovery

          1. Connect the PC to any **LAN** port (1G or 2.5G/10G; the WAN port is not served in auto mode) and leave the PC NIC in DHCP mode.
          2. Connect the device to power.
          3. The status LED starts cycling through its colours. This is the recovery window (3 seconds by default).
          4. Press the recessed \`RESET\` button once while the LED is cycling.
          5. The status LED turns blue immediately when the button is pressed and then stays steady. The web server needs a few more seconds to come up.
          6. Open [http://192.168.255.1](http://192.168.255.1/) (retry once if the page does not load yet).
          7. Select the **\`uboot\`** target.
          8. Upload **\`${SLOT_NAME}\`** and wait for flashing to complete.

          If the window is missed the status LED flashes three times and the device continues to boot normally; power-cycle it and try again.

          ### 中文步骤（同一流程）

          1. 电脑接任意 **LAN** 口（1G 或 2.5G/10G；WAN 口在 auto 模式下不提供服务），网卡保持 DHCP。
          2. 给设备上电。
          3. 状态灯开始按颜色循环闪烁，这就是恢复窗口（默认 3 秒）。
          4. 在灯循环期间按一次 recessed \`RESET\` 键。
          5. 按下按键的瞬间状态灯就变成蓝色，之后维持常亮；网页服务还需要几秒才能起来。
          6. 浏览器打开 [http://192.168.255.1](http://192.168.255.1/)（若打不开，等几秒再刷新）。
          7. 选择 **\`uboot\`** 目标。
          8. 上传 **\`${SLOT_NAME}\`** 并等待烧写完成。

          如果错过了窗口，状态灯会快速闪 3 次然后正常启动；重新上电再试即可。

          > **Important: Do not power off, disconnect, or reboot the device during recovery!**

          ---

          ## Donate

          <p align="center">
            如果这个项目对您有所帮助，欢迎请我喝杯咖啡，支持后续维护和更新。
          </p>

          <p align="center">
            <img src="https://github.com/naoki66/XR1710G-http-uboot/raw/${RELEASE_TAG}/c6ea388c976395326514814f80d512d5.png" alt="Donate" width="240">
          </p>
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [ "$RELEASE_MODE" = "pre-release" ]; then
              gh release edit "$RELEASE_TAG" \
                --target "$GITHUB_SHA" \
                --title "$RELEASE_TITLE" \
                --notes-file "$NOTES_FILE" \
                --prerelease \
                --latest=false
            else
              gh release edit "$RELEASE_TAG" \
                --target "$GITHUB_SHA" \
                --title "$RELEASE_TITLE" \
                --notes-file "$NOTES_FILE" \
                --prerelease=false \
                --latest
            fi
            gh release upload "$RELEASE_TAG" "$SLOT_PATH" "$FIT_PATH" --clobber
          elif [ "$RELEASE_MODE" = "pre-release" ]; then
            gh release create "$RELEASE_TAG" "$SLOT_PATH" "$FIT_PATH" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes-file "$NOTES_FILE" \
              --prerelease \
              --latest=false
          else
            gh release create "$RELEASE_TAG" "$SLOT_PATH" "$FIT_PATH" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes-file "$NOTES_FILE" \
              --latest
          fi
